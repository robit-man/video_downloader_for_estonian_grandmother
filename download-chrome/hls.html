<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OK Clip Saver — stream download</title><style>
:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#f6f7f8;color:#252a2f;font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}.wrapper{max-width:630px;margin:7vh auto;padding:0 20px}.sheet{padding:26px;background:white;border:1px solid #e1e5e7;border-radius:13px}header{display:flex;justify-content:space-between;align-items:center;gap:15px}h1{font-size:20px;letter-spacing:-.4px;margin:0}.muted{color:#6d777f}small{font-size:12px}button{border:1px solid #dbe0e2;background:#fff;border-radius:7px;font:inherit;padding:8px 14px;cursor:pointer}button.primary{color:#fff;background:#26292d;border-color:#26292d}button:disabled{opacity:.55;cursor:wait}.bar{width:100%;height:9px;border-radius:20px;background:#ebeef0;overflow:hidden;margin-top:23px}.fill{height:100%;width:0;background:#3b7d63;transition:width .15s}.controls{margin-top:16px;display:flex;align-items:center;justify-content:space-between;gap:10px}.box{border-radius:8px;background:#f6f7f8;padding:12px 14px;white-space:pre-wrap;overflow-wrap:anywhere;font:11px/1.6 ui-monospace,Menlo,Consolas,monospace;max-height:250px;overflow:auto;margin-top:20px}.label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;color:#7a848d;letter-spacing:.7px;margin-top:25px}.warn{background:#fff9eb;border:1px solid #f0e4bb;border-radius:8px;font-size:12px;padding:10px 12px;margin-top:16px;color:#7b642b}.error{color:#a83737;font-weight:600}
</style></head><body><div class="wrapper"><div class="sheet"><header><div><h1 id="title">Download HLS stream</h1><small class="muted" id="subtitle">Saving as a transport-stream file (.ts)</small></div><button type="button" id="lang">Русский</button></header><p id="status" class="muted">Preparing…</p><div class="bar"><div id="fill" class="fill"></div></div><div class="controls"><span id="progress" class="muted">0%</span><button id="cancel" type="button">Cancel</button></div><div class="warn" id="disclaimer">Only unencrypted HLS streams are supported (MPEG-TS and compatible fMP4). Complex, copy-protected and DRM streams are not supported.</div><span class="label" id="logTitle">Diagnostics</span><div class="box" id="log">Ready.</div></div></div><script src="media.js"></script><script src="hls.js"></script></body></html>
